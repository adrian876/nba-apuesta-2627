<style>

<body>
<div class="wall"><i style="background-image:url(img/bg/wemby2.jpg)"></i><i style="background-image:url(img/bg/jokic.jpg)"></i><i style="background-image:url(img/bg/doncic.jpg)"></i><i style="background-image:url(img/bg/lebron2.jpg)"></i><i style="background-image:url(img/bg/giannis.jpg)"></i></div>
<div class="wrap">
<header>
  <h1>🏀 Apuesta NBA 2026/27</h1>
  <div id="status" class="status">Cargando…</div>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<p class="sub" style="margin-top:30px">Gana quien tenga menos puntos. Puntos = suma de la diferencia entre tu posición apostada y la real en cada conferencia, menos los bonus de copa y premios.</p>
</div>

<script>
/* ============================================================
   Las apuestas (PLAYERS) y los resultados de copa y premios (RESULTS)
   están en data/apuestas.json, compartidos con scripts/update.mjs.
   ============================================================ */
let PLAYERS = {}, RESULTS = {};
let CAL = null, HIST = null, PLANT = null;   // data/calendario.json y data/historial.json (GitHub Actions)

const NAMES = {
  doncic:'Luka Dončić', duren:'Jalen Duren', mamukelashvili:'Sandro Mamukelashvili', sexton:'Collin Sexton',
  spoelstra:'Erik Spoelstra', wembanyama:'Victor Wembanyama', harper:'Dylan Harper', hezonja:'Mario Hezonja',
  redick:'JJ Redick', jokic:'Nikola Jokić', buzelis:'Matas Buzelis', dosunmu:'Ayo Dosunmu',
  mazzulla:'Joe Mazzulla', queta:'Neemias Queta', portis:'Bobby Portis', mjohnson:'Mitch Johnson',
};

// Puntos de los bonus; deben coincidir con BETS de scripts/update.mjs
const BETS = [
  { key:'cup',   label:'Copa',            short:'Copa',  win:-6, fin:-2, team:true },
  { key:'mvp',   label:'MVP',             short:'MVP',   win:-3, fin:-1 },
  { key:'dpoy',  label:'DPOY',            short:'DPOY',  win:-3, fin:-1 },
  { key:'mip',   label:'MIP',             short:'MIP',   win:-6, fin:-2 },
  { key:'sixth', label:'6º hombre',       short:'6º',    win:-6, fin:-2 },
  { key:'coach', label:'Entrenador',      short:'Entr.', win:-6, fin:-2 },
];

const API = 'https://site.api.espn.com/apis/v2/sports/basketball/nba/standings';
const REFRESH_MS = 120000;

/* ============================================================ */
let TEAMS = {};        // abbr -> {abbr,name,logo,conf,pos,w,l,gp,streak,l10}
let ORDER = {E:[],W:[]};
let PRESEASON = false;
let REG = { start:'2026-10-20T07:00:00Z', end:'2027-04-12T06:59:00Z' };
const GAMES = 82;
const BET_START = '2026-10-18';   // primer día del historial: el eje X del gráfico va de aquí a hoy
let tab = 'general', selPlayer = null;
let names = [];

const $ = s => document.querySelector(s);
const COLORS = {Ghali:'#f59e0b', Telmo:'#38bdf8', Manu:'#e879f9', Adrian:'#4ade80'};
const TZ = 'Europe/Madrid', US = 'America/New_York';
const dayIn = (tz, d=new Date()) => new Intl.DateTimeFormat('en-CA',{timeZone:tz}).format(d);
const addDays = (day, n) => { const d=new Date(day+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };

function parse(data){
  const teams = {}, order = {E:[],W:[]};
  for (const ch of data.children){
    const conf = /east/i.test(ch.name) ? 'E' : 'W';
    const list = ch.standings.entries.map(e=>{
      const s = {}; e.stats.forEach(x=>s[x.name]=x.displayValue);
      const w = +s.wins||0, l = +s.losses||0;
      return { abbr:e.team.abbreviation, name:e.team.displayName,
        logo:(e.team.logos&&e.team.logos[0]&&e.team.logos[0].href)||'', conf,
        seed:+s.playoffSeed||99, w, l, gp:w+l, pct:+s.winPercent||0, diff:+s.pointDifferential||0,
        streak:s.streak||'-', l10:s['Last Ten Games']||'-' };
    });
    list.sort((a,b)=>a.seed-b.seed || b.pct-a.pct || b.diff-a.diff);
    list.forEach((t,i)=>{ t.pos=i+1; teams[t.abbr]=t; });
    if(isPre(data)) list.sort((a,b)=>a.name.localeCompare(b.name));
    order[conf]=list;
  }
  return {teams,order};
}

function isPre(data){
  const t=data.seasons&&data.seasons[0]&&data.seasons[0].types||[];
  const now=Date.now(), reg=t.find(x=>x.abbreviation==='reg');
  if(reg) REG={start:reg.startDate,end:reg.endDate};
  return reg ? now < new Date(reg.startDate).getTime() : false;
}

function betPoints(p, b){
  const pick = PLAYERS[p][b.key], r = RESULTS[b.key];
  if (!r.winner) return {pts:0, state:'pending'};
  if (pick===r.winner) return {pts:b.win, state:'win'};
  if ((r.finalists||[]).includes(pick)) return {pts:b.fin, state:'fin'};
  return {pts:0, state:'no'};
}

function score(force){
  return names.map(n=>{
    let base=0; const rows=[];
    for (const c of ['E','W']){
      PLAYERS[n][c].forEach((abbr,i)=>{
        const t=TEAMS[abbr]; const d=t&&(force||!PRESEASON)?Math.abs(t.pos-(i+1)):0;
        base+=d; rows.push({conf:c,abbr,bet:i+1,real:t?t.pos:null,d});
      });
    }
    let bonus=0; BETS.forEach(b=>bonus+=betPoints(n,b).pts);
    return {name:n,base,bonus,total:base+bonus,rows};
  }).sort((a,b)=>a.total-b.total || a.base-b.base);
}

const tname = a => TEAMS[a]?TEAMS[a].name:a;
const logoUrl = a => TEAMS[a]&&TEAMS[a].logo || `https://a.espncdn.com/i/teamlogos/nba/500/${a.toLowerCase()}.png`;
const logo = a => `<img src="${logoUrl(a)}" alt="" loading="lazy">`;
const JPG = {redick:1,spoelstra:1,mazzulla:1};
const person = (n,cls='') => `<img class="av ${cls}" src="img/people/${n}.jpg" alt="${n}">`;
const pickImg = (b,id) => b.team ? logo(id) : `<img class="av" src="img/awards/${id}.${JPG[id]?'jpg':'png'}" alt="" loading="lazy" onerror="this.style.display='none'">`;
const pickName = (b,id) => b.team ? tname(id) : (NAMES[id]||id);
const sign = n => n>0?'+'+n:String(n);

function dcolor(d){
  if(d===0) return 'background:rgba(34,197,94,.25)';
  if(d<=2)  return 'background:rgba(34,197,94,.10)';
  if(d<=4)  return 'background:rgba(245,158,11,.14)';
  if(d<=6)  return 'background:rgba(249,115,22,.20)';
  return 'background:rgba(239,68,68,.25)';
}

/* ---------- vistas ---------- */
function feast(sc){
  const pics=['f02','f03','f04','f05','f08'].map(f=>`<i style="background-image:url(img/food/${f}.jpg)"></i>`).join('');
  const sc2=score(true);
  const gu=sc2.slice(0,2).map(x=>x.name).join(' y '), pa=sc2.slice(2).map(x=>x.name).join(' y ');
  const end=new Date(REG.end).getTime(), start=new Date(REG.start).getTime(), now=Date.now();
  const days=Math.max(0,Math.ceil((end-now)/864e5));
  const gp=PRESEASON?0:Math.max(0,...Object.values(TEAMS).map(t=>t.gp));
  const pct=Math.min(100,Math.max(0,100*(now-start)/(end-start)));
  const fin=new Date(end).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});
  const who=`<b>${pa}</b> inviten a <b>${gu}</b>`;
  return `<div class="feast"><div class="pics">${pics}</div><div class="txt">
    <div class="cd"><span class="big">${days}<small>${days===1?'día':'días'}</small></span><span>para que ${who} a una cena <b>gourmet</b> de las buenas 🍷</span></div>
    <div class="fbar"><i style="width:${pct}%"></i></div>
    <p class="fsub">Jornada <b>${gp}</b> de ${GAMES} · fin de la liga regular: ${fin}</p>
  </div></div>`;
}

function viewGeneral(){
  const sc=score();
  const medals=['🥇','🥈','🥉','4º'];
  let h='<h2 style="margin-top:4px">Evolución</h2>'+chart();
  h+='<h2>Clasificación</h2><div class="tablebox"><table class="rk"><tr><th>#</th><th class="l">Jugador</th><th>Puntos</th><th>Dif.</th></tr>'
    +sc.map((s,i)=>`<tr class="${i<2?'eat':'pay'}"><td class="md">${medals[i]||i+1+'º'}</td>
      <td class="l"><div class="who"><i class="dot" style="background:${COLORS[s.name]}"></i>${person(s.name)}<div><b>${s.name}</b> <span class="tag ${i<2?'win':'no'}">${i<2?'come':'paga'}</span><div class="det">posiciones ${s.base} · bonus ${s.bonus}</div></div></div></td>
      <td class="pt">${s.total}</td><td>${i?'+'+(s.total-sc[0].total):'—'}</td></tr>`).join('')
    +'</table></div>';
  h+='<h2>La apuesta</h2>'+feast(sc);
  h+='<h2>Resumen bonus</h2>'+betsTable();
  return h;
}

/* ---------- gráfico de evolución: un punto por día ---------- */
function chart(){
  const days=(HIST&&HIST.days||[]).map(x=>({d:x.d,pts:Object.fromEntries(Object.entries(x.pts).map(([n,v])=>[n,v[0]]))}));
  // el día de hoy siempre con la puntuación en vivo
  const today=dayIn(TZ), live={d:today,pts:Object.fromEntries(score().map(s=>[s.name,s.total]))};
  const i=days.findIndex(x=>x.d===today); if(i>=0) days[i]=live; else days.push(live);
  days.sort((a,b)=>a.d.localeCompare(b.d));
  for(let k=days.length-1;k>=0;k--) if(days[k].d<BET_START||days[k].d>today) days.splice(k,1);

  const W=Math.max(340,Math.min(1068,(window.innerWidth||800)-34)), H=320, L=38, R=120, T=24, B=30;
  const first=BET_START, idx=d=>Math.round((new Date(d)-new Date(first))/864e5);
  const span=idx(today);
  const vals=days.flatMap(x=>names.map(n=>x.pts[n]).filter(v=>v!=null));
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(hi-lo<10){const m=(hi+lo)/2; lo=m-5; hi=m+5;}
  const pad=(hi-lo)*.08; lo-=pad; hi+=pad;
  const X=d=>L+(span?idx(d)/span:0)*(W-L-R), Y=v=>T+(v-lo)/(hi-lo)*(H-T-B);   // menos puntos = más arriba

  let g='';
  for(let k=0;k<=4;k++){
    const v=lo+(hi-lo)*k/4, y=Y(v);
    g+=`<line x1="${L}" x2="${W-R+10}" y1="${y}" y2="${y}" class="gl"/><text x="${L-6}" y="${y+4}" text-anchor="end" class="ax">${Math.round(v)}</text>`;
  }
  const step=Math.max(1,Math.ceil(span/Math.max(2,Math.floor((W-L-R)/70))));
  const ticks=[];
  for(let k=0;k<=span;k+=step) if(!(k&&span-k<step*.6)) ticks.push(k);   // que no se pisen con la última
  if(ticks[ticks.length-1]!==span) ticks.push(span);                     // hoy siempre aparece
  for(const k of ticks){
    const d=addDays(first,k);
    g+=`<text x="${X(d)}" y="${H-8}" text-anchor="${k===0&&span?'start':'middle'}" class="ax">${new Date(d+'T12:00:00Z').toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</text>`;
  }
  const ends=[];
  for(const n of names){
    const pts=days.filter(x=>x.pts[n]!=null).map(x=>[X(x.d),Y(x.pts[n])]);
    if(!pts.length) continue;
    g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${COLORS[n]}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    g+=pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.5" fill="${COLORS[n]}"/>`).join('');
    const [x,y]=pts[pts.length-1];
    ends.push({n,x,y,ly:y,v:days.filter(d=>d.pts[n]!=null).at(-1).pts[n]});
  }
  // separar las fotos cuando coinciden
  ends.sort((a,b)=>a.y-b.y);
  for(let k=1;k<ends.length;k++) ends[k].ly=Math.max(ends[k].ly,ends[k-1].ly+38);
  const over=ends.length?ends[ends.length-1].ly-(H-B-16):0;
  if(over>0) ends.forEach(e=>e.ly-=over);
  for(const e of ends){
    const ax=e.x+30;
    g+=`<line x1="${e.x}" y1="${e.y}" x2="${ax-18}" y2="${e.ly}" stroke="${COLORS[e.n]}" stroke-width="1.5" stroke-dasharray="3 3"/>
      <clipPath id="cp-${e.n}"><circle cx="${ax}" cy="${e.ly}" r="16"/></clipPath>
      <image href="img/people/${e.n}.jpg" x="${ax-16}" y="${e.ly-16}" width="32" height="32" clip-path="url(#cp-${e.n})" preserveAspectRatio="xMidYMid slice"/>
      <circle cx="${ax}" cy="${e.ly}" r="16" fill="none" stroke="${COLORS[e.n]}" stroke-width="3"/>
      <text x="${ax+24}" y="${e.ly+5}" class="lb">${e.n} <tspan class="lv">${e.v}</tspan></text>`;
  }
  const note=PRESEASON?' Hasta que empiece la liga regular todos están a 0.':'';
  return `<p class="sub">Puntuación de cada uno, un punto por día. Menos puntos = más arriba.${note}</p>
    <div class="tablebox chart"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución de la puntuación">${g}</svg></div>`;
}

/* ---------- calendario ---------- */
let calDay = null, LIVE = {day:null, at:0, games:{}};

function normGame(e){
  const c=e.competitions[0], st=(e.status||c.status||{}).type||{};
  const side=h=>{const t=c.competitors.find(x=>x.homeAway===h); const s=t.score==null?null:typeof t.score==='object'?t.score.displayValue:t.score;
    return {t:t.team.abbreviation, s:s==null||s===''?null:+s};};
  const g={id:e.id,d:e.date,home:side('home'),away:side('away'),st:st.state||'pre',det:st.shortDetail||''};
  const note=c.notes&&c.notes[0]&&c.notes[0].headline; if(note) g.note=note;
  return g;
}

// marcadores en vivo de ESPN para el día elegido si es ayer, hoy o mañana
async function liveDay(day){
  const today=dayIn(US);
  if(Math.abs((new Date(day)-new Date(today))/864e5)>1) return;
  if(LIVE.day===day && Date.now()-LIVE.at<60000) return;
  try{
    const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates='+day.replaceAll('-',''),{cache:'no-store'});
    const d=await r.json();
    LIVE={day,at:Date.now(),games:Object.fromEntries((d.events||[]).map(e=>[e.id,normGame(e)]))};
    if(tab==='cal' && calDay===day) render();
  }catch(e){}
}

// +1: el equipo va peor de lo que apostó (le conviene que gane); -1: va mejor (le conviene que pierda)
function lean(n,abbr){
  const t=TEAMS[abbr]; if(!t) return 0;
  const i=PLAYERS[n][t.conf].indexOf(abbr); if(i<0) return 0;
  return Math.sign(t.pos-(i+1));
}
// quién quiere que gane cada equipo: compara lo que le conviene a cada uno con los dos equipos
function fans(g){
  const r={home:[],away:[]};
  if(PRESEASON) return r;
  for(const n of names){ const v=lean(n,g.away.t)-lean(n,g.home.t); if(v>0) r.away.push(n); else if(v<0) r.home.push(n); }
  return r;
}
const fanImgs=(list,cls='fan')=>list.map(n=>`<img class="${cls}" src="img/people/${n}.jpg" alt="${n}" title="${n}">`).join('');

function dayGames(){
  const games=CAL.games.filter(g=>dayIn(US,new Date(g.d))===calDay).map(g=>LIVE.day===calDay&&LIVE.games[g.id]?{...g,...LIVE.games[g.id]}:g);
  if(LIVE.day===calDay) for(const g of Object.values(LIVE.games)) if(!games.find(x=>x.id===g.id)) games.push(g);
  return games.sort((a,b)=>a.d.localeCompare(b.d));
}
function gameStatus(g){
  const t=new Date(g.d), hm=t.toLocaleTimeString('es-ES',{timeZone:TZ,hour:'2-digit',minute:'2-digit'});
  const wd=dayIn(TZ,t)!==calDay?' · '+t.toLocaleDateString('es-ES',{timeZone:TZ,weekday:'short'}):'';
  return g.st==='in'?`<span class="livedot"></span>${g.det}`:g.st==='post'?(g.det||'Final'):`${hm}${wd}`;
}

function viewCal(){
  if(!CAL) return '<p class="sub">Cargando calendario…</p>';
  const games=dayGames();
  liveDay(calDay);
  if(openGame){ const g=games.find(x=>x.id===openGame)||CAL.games.find(x=>x.id===openGame); if(g) return viewGame(g); openGame=null; }
  const first=dayIn(US,new Date(CAL.games[0].d)), last=dayIn(US,new Date(CAL.games[CAL.games.length-1].d));
  const t0=new Date(calDay+'T12:00:00Z').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
  const title=t0.charAt(0).toUpperCase()+t0.slice(1);
  let h=`<div class="calbar">
    <button class="pill" data-cal="-1" aria-label="Día anterior">◀</button>
    <input type="date" id="calpick" value="${calDay}" min="${first}" max="${last}">
    <button class="pill" data-cal="1" aria-label="Día siguiente">▶</button>
    <button class="pill" data-cal="0">Hoy</button>
  </div>
  <p class="sub">${title}</p>
  <p class="sub">Jornada de EE. UU.; las horas están en hora española. Toca un partido para ver las estadísticas. Las caras indican a quién le conviene que gane cada equipo.</p>`;
  if(!games.length) return h+'<div class="card"><p class="sub" style="margin:0">No hay partidos este día.</p></div>';
  h+='<div class="games">'+games.map(g=>{
    const done=g.st==='post', on=g.st==='in', f=fans(g);
    const aw=done&&g.away.s>g.home.s, hw=done&&g.home.s>g.away.s;
    const row=(s,win,fl)=>`<div class="gt ${done&&!win?'lose':''}">${logo(s.t)}<span>${tname(s.t)}</span><i class="fans">${fanImgs(fl)}</i><b>${g.st==='pre'||s.s==null?'':s.s}</b></div>`;
    return `<button class="card game" data-game="${g.id}"><div class="gs ${on?'on':''}">${gameStatus(g)}<span class="more">Ver estadísticas ›</span></div>${row(g.away,aw,f.away)}${row(g.home,hw,f.home)}${g.note?`<div class="gn">${g.note}</div>`:''}</button>`;
  }).join('')+'</div>';
  return h;
}

/* ---------- ficha de un partido ---------- */
let openGame=null, BOX={id:null,at:0,data:null,err:false};

async function loadBox(g){
  const fresh=BOX.id===g.id&&BOX.data&&(g.st==='post'||Date.now()-BOX.at<25000);
  if(fresh||(BOX.id===g.id&&BOX.loading)) return;
  BOX={id:g.id,at:Date.now(),data:BOX.id===g.id?BOX.data:null,loading:true};
  try{
    const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event='+g.id,{cache:'no-store'});
    BOX={id:g.id,at:Date.now(),data:await r.json(),loading:false};
  }catch(e){ BOX={id:g.id,at:Date.now(),data:null,err:true,loading:false}; }
  if(tab==='cal'&&openGame===g.id) render();
}

const pct=(m,a)=>a>0?(100*m/a).toFixed(1).replace('.0',''):'–';
const shortName=n=>{const p=n.split(' '); return p.length>1?p[0][0]+'. '+p.slice(1).join(' '):n;};
const pm=v=>{const n=+v; return isNaN(n)?v:`<span class="${n>0?'W':n<0?'L':''}">${n>0?'+'+n:n}</span>`;};

// tabla de la estadística del partido de un equipo (boxscore de ESPN)
function boxTable(tp){
  const st=tp.statistics[0], L={}; st.labels.forEach((l,i)=>L[l]=i);
  const v=(arr,k)=>arr[L[k]]??'';
  const split=x=>{const [m,a]=(x||'0-0').split('-').map(Number); return [m,a];};
  const cells=arr=>{const [fm,fa]=split(v(arr,'FG')), [tm,ta]=split(v(arr,'3PT'));
    return `<td>${v(arr,'MIN')}</td><td class="b">${v(arr,'PTS')}</td><td>${v(arr,'REB')}</td><td>${v(arr,'AST')}</td><td>${v(arr,'STL')}</td><td>${v(arr,'TO')}</td>
      <td>${v(arr,'FG')}</td><td>${pct(fm,fa)}</td><td>${v(arr,'3PT')}</td><td>${pct(tm,ta)}</td><td>${pm(v(arr,'+/-'))}</td>`;};
  const played=st.athletes.filter(a=>!a.didNotPlay&&a.stats&&a.stats.length), dnp=st.athletes.filter(a=>a.didNotPlay||!a.stats||!a.stats.length);
  let h=`<div class="tablebox box"><table><tr><th class="l">Jugador</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>ROB</th><th>PÉR</th><th>TC</th><th>%TC</th><th>T3</th><th>%T3</th><th>+/-</th></tr>`;
  played.forEach((a,i)=>{
    if(i&&a.starter!==played[i-1].starter) h+='<tr class="sep"><td class="l" colspan="12">Banquillo</td></tr>';
    h+=`<tr><td class="l"><span class="jn">${a.athlete.jersey||''}</span>${a.athlete.shortName||shortName(a.athlete.displayName)}${a.starter?' <small class="st">T</small>':''}</td>${cells(a.stats)}</tr>`;
  });
  if(st.totals&&st.totals.length) h+=`<tr class="tot"><td class="l">Total</td>${cells(st.totals).replace(/<td>[^<]*<\/td>/,'<td></td>')}</tr>`;
  if(dnp.length) h+=`<tr class="dnp"><td class="l" colspan="12">No jugaron: ${dnp.map(a=>a.athlete.shortName||a.athlete.displayName).join(', ')}</td></tr>`;
  return h+'</table></div>';
}

// plantilla con medias de la temporada (partido sin jugar)
function rosterTable(abbr){
  const list=(PLANT&&PLANT.teams[abbr]||[]).slice().sort((a,b)=>(b.s?b.s.pts:-1)-(a.s?a.s.pts:-1));
  if(!list.length) return '<p class="sub">No hay plantilla guardada para este equipo.</p>';
  const f=x=>x==null?'–':x;
  let h=`<div class="tablebox box"><table><tr><th class="l">Jugador</th><th>PJ</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>ROB</th><th>PÉR</th><th>TC</th><th>%TC</th><th>T3</th><th>%T3</th></tr>`;
  for(const p of list){
    const s=p.s, inj=p.inj?` <small class="inj" title="${p.inj}">${/out/i.test(p.inj)?'baja':'duda'}</small>`:'';
    h+=`<tr><td class="l"><span class="jn">${p.j}</span>${shortName(p.n)}${inj}</td>`+(s?
      `<td>${s.gp}</td><td>${s.min}</td><td class="b">${s.pts}</td><td>${s.reb}</td><td>${s.ast}</td><td>${s.stl}</td><td>${s.to}</td><td>${s.fgm}-${s.fga}</td><td>${f(s.fgp)}</td><td>${s.tpm}-${s.tpa}</td><td>${f(s.tpp)}</td>`
      :'<td colspan="11" class="sub" style="text-align:left">Sin partidos la temporada pasada</td>')+'</tr>';
  }
  return h+'</table></div>';
}

// por qué le conviene a cada uno: dónde apostó cada equipo y dónde va
function whyLine(n,g){
  const part=a=>{const t=TEAMS[a]; if(!t) return ''; const i=PLAYERS[n][t.conf].indexOf(a)+1; return `${a} apostó ${i}º, va ${t.pos}º`;};
  const v=lean(n,g.away.t)-lean(n,g.home.t);
  const want=v>0?`<b>${tname(g.away.t)}</b>`:v<0?`<b>${tname(g.home.t)}</b>`:'le da igual';
  return `<div class="why">${person(n)}<div><b>${n}</b> → ${want}<small>${part(g.away.t)} · ${part(g.home.t)}</small></div></div>`;
}

function viewGame(g){
  const done=g.st==='post', f=fans(g);
  const sc=s=>g.st==='pre'||s.s==null?'':s.s;
  const side=(s,fl,win)=>`<div class="gside ${done&&!win?'lose':''}">${logo(s.t)}<b class="nm">${tname(s.t)}</b><span class="sc">${sc(s)}</span>
      <div class="want">${fl.length?`<small>Quieren que gane:</small>${fanImgs(fl,'fanb')}`:'<small>No le conviene a nadie en especial</small>'}</div></div>`;
  let h=`<button class="pill" data-back>← Volver a la jornada</button>
    <div class="card ghead"><div class="gs ${g.st==='in'?'on':''}">${gameStatus(g)}${g.note?' · '+g.note:''}</div>
    ${side(g.away,f.away,done&&g.away.s>g.home.s)}${side(g.home,f.home,done&&g.home.s>g.away.s)}</div>`;
  h+=PRESEASON?'<p class="sub">A quién le conviene cada equipo se calcula con la clasificación de liga regular, desde el 20/10.</p>'
    :`<details class="card whys"><summary>¿Por qué? (dónde apostó cada uno y dónde va)</summary>${names.map(n=>whyLine(n,g)).join('')}</details>`;
  const legend='<p class="sub">TC: tiros de campo (metidos-intentados) · T3: triples · ROB: robos · PÉR: pérdidas · T: titular</p>';
  if(g.st==='pre'){
    const cur=PLANT&&PLANT.season==='2026-27';
    h+=`<p class="sub">Partido sin jugar: medias por partido de cada jugador en la temporada ${PLANT?PLANT.season:''}${cur?'':' (la temporada pasada, porque la actual todavía no tiene partidos)'}. Jugadores en la plantilla actual.</p>`+legend;
    for(const s of [g.away,g.home]) h+=`<h2 class="tn">${logo(s.t)}${tname(s.t)}</h2>`+rosterTable(s.t);
    return h;
  }
  loadBox(g);
  const box=BOX.id===g.id&&BOX.data&&BOX.data.boxscore;
  if(!box) return h+`<p class="sub">${BOX.err?'No se pudieron cargar las estadísticas de ESPN.':'Cargando estadísticas…'}</p>`;
  const teams=box.players||[];
  if(!teams.length) return h+'<p class="sub">ESPN aún no tiene estadísticas de jugadores para este partido.</p>';
  h+=legend+(g.st==='in'?'<p class="sub">En directo: se actualiza cada 30 segundos.</p>':'');
  for(const ab of [g.away.t,g.home.t]){
    const tp=teams.find(t=>t.team.abbreviation===ab); if(!tp) continue;
    h+=`<h2 class="tn">${logo(ab)}${tname(ab)}</h2>`+boxTable(tp);
  }
  return h;
}

// cuadrícula de fotos: una fila por amigo, una columna por apuesta; al tocar una foto se ve el nombre
function betsTable(){
  const ico=(b,id,st,info)=>`<button class="bi ${st}" data-info="${info}">${b.team?`<img src="${logoUrl(id)}" alt="" class="lg">`:pickImg(b,id)}</button>`;
  let h='<div class="tablebox"><table class="bg"><tr><th></th>'+BETS.map(b=>`<th>${b.short}<small>${b.win}/${b.fin}</small></th>`).join('')+'</tr>';
  for(const n of names){
    h+=`<tr><td class="bn">${person(n)}<small>${n}</small></td>`+BETS.map(b=>{
      const id=PLAYERS[n][b.key], st=betPoints(n,b).state;
      const res={win:` · acertada (${b.win})`,fin:` · finalista (${b.fin})`,no:' · fallada',pending:''}[st];
      return `<td>${ico(b,id,st,`${n} · ${b.label}: ${pickName(b,id)}${res}`)}</td>`;
    }).join('')+'</tr>';
  }
  h+='<tr class="res"><td class="bn"><b>🏆</b><small>Resultado</small></td>'+BETS.map(b=>{
    const r=RESULTS[b.key];
    if(!r.winner) return `<td><button class="bi pend" data-info="${b.label}: pendiente">?</button></td>`;
    const fin=(r.finalists||[]).filter(x=>x!==r.winner).map(x=>pickName(b,x)).join(', ');
    return `<td>${ico(b,r.winner,'win',`${b.label}: ganó ${pickName(b,r.winner)}${fin?' · finalistas: '+fin:''}`)}</td>`;
  }).join('')+'</tr></table></div>';
  return h+`<p class="sub" id="binfo" style="margin-top:8px">Toca una foto para ver el nombre. Verde: acertada · naranja: finalista · gris: fallada.</p>`;
}

function viewConf(c, title){
  let h=`<h2>${title}</h2><div class="tablebox"><table><tr><th>#</th><th class="l">Equipo</th><th>PJ</th><th>G</th><th>P</th><th>Racha</th><th>Últ. 10</th>`+names.map(n=>`<th>${person(n)}${n}</th>`).join('')+'</tr>';
  const pos={}; names.forEach(n=>PLAYERS[n][c].forEach((a,i)=>{(pos[a]=pos[a]||{})[n]=i+1;}));
  for(const t of ORDER[c]){
    h+=`<tr><td><b>${PRESEASON?'-':t.pos}</b></td><td class="l"><div class="team">${logo(t.abbr)}<span>${t.name}</span></div></td>
      ${PRESEASON?'<td>0</td><td>0</td><td>0</td><td>-</td><td>-</td>':`<td>${t.gp}</td><td>${t.w}</td><td>${t.l}</td><td class="${t.streak[0]==='W'?'W':'L'}">${t.streak}</td><td>${t.l10}</td>`}`;
    for(const n of names){
      const bet=pos[t.abbr][n], d=PRESEASON?0:Math.abs(bet-t.pos);

    }
    h+='</tr>';
  }
  return h+'</table></div>';
}
function viewComp(){
  return '<p class="sub">Cada celda: posición que apostó cada uno y los puntos que le suma ese equipo ahora mismo (menos = mejor).</p>'
    +viewConf('E','Conferencia Este')+viewConf('W','Conferencia Oeste');
}

  h+='<div class="bets">';

    for(const r of me.rows.filter(r=>r.conf===c)){
      const t=TEAMS[r.abbr];
      h+=`<tr><td>${r.bet}º</td><td class="l"><div class="team">${logo(r.abbr)}<span>${tname(r.abbr)}</span></div></td><td>${PRESEASON?'-':(r.real??'-')+'º'}</td>
        <td><span class="cell" style="${dcolor(r.d)}"><b>${r.d}</b></span></td><td>${t&&!PRESEASON?t.w+'-'+t.l:'0-0'}</td></tr>`;
    }
    h+='</table></div></div>';
  }
  h+='</div><h2>Bonus</h2><div class="tablebox"><table><tr><th class="l">Apuesta</th><th class="l">Tu elección</th><th>Estado</th></tr>';
  for(const b of BETS){
    const bp=betPoints(selPlayer,b);
    const st={pending:'<span class="tag">pendiente</span>',win:`<span class="tag win">ganada ${bp.pts}</span>`,fin:`<span class="tag fin">finalista ${bp.pts}</span>`,no:'<span class="tag no">fallada</span>'}[bp.state];
    h+=`<tr><td class="l">${b.label}</td><td class="l"><div class="team">${pickImg(b,PLAYERS[selPlayer][b.key])}<span>${pickName(b,PLAYERS[selPlayer][b.key])}</span></div></td><td>${st}</td></tr>`;
  }
  return h+'</table></div>';
}

const TABS={general:['Marcador',viewGeneral],comp:['Clasificación',viewComp],player:['Jugadores',viewPlayer],cal:['Calendario',viewCal]};

function render(){
  $('#tabs').innerHTML=Object.entries(TABS).map(([k,v])=>`<button data-t="${k}" class="${k===tab?'on':''}">${v[0]}</button>`).join('');
  $('#view').innerHTML=Object.keys(TEAMS).length&&names.length?TABS[tab][1]():'';
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]'), p=e.target.closest('[data-p]'), c=e.target.closest('[data-cal]'), gm=e.target.closest('[data-game]'), bk=e.target.closest('[data-back]');
  if(t){tab=t.dataset.t;openGame=null;render();}
  else if(gm){openGame=gm.dataset.game;render();window.scrollTo(0,0);}
  else if(bk){openGame=null;render();}
  else if(p){selPlayer=p.dataset.p;render();}
  else if(c){const n=+c.dataset.cal; calDay=n?addDays(calDay,n):dayIn(US); openGame=null; render();}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-info]'); if(!b) return;
  document.querySelectorAll('.bi.sel').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
  const i=document.getElementById('binfo'); if(i) i.textContent=b.dataset.info;
});
document.addEventListener('change',e=>{
  if(e.target.id==='calpick'&&e.target.value){calDay=e.target.value;render();}
});

// datos guardados por GitHub Actions en el propio repo
async function loadRepoData(){
  // si no se pueden leer los archivos locales (p. ej. abriendo el html con doble clic, file://), se leen del repo en GitHub
  const RAW='https://raw.githubusercontent.com/adrian876/nba-apuesta-2627/main/';
  const one=u=>fetch(u,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
  const get=async f=>(location.protocol.startsWith('http')&&await one(f+'?t='+Date.now()))||one(RAW+f+'?t='+Date.now());
  if(!names.length){
    const a=await get('data/apuestas.json');
    if(a){PLAYERS=a.players; RESULTS=a.results; names=Object.keys(PLAYERS); selPlayer=names[0];}
  }
  const calOld=!CAL||Date.now()-calAt>600000;   // el calendario pesa: cada 10 min basta
  const [c,h,pl]=await Promise.all([calOld?get('data/calendario.json'):null,get('data/historial.json'),calOld?get('data/plantillas.json'):null]);
  if(c){CAL=c; calAt=Date.now();} if(h) HIST=h; if(pl) PLANT=pl;
}
let calAt=0;

async function load(){
  const st=$('#status');
  if(!calDay) calDay=dayIn(US);
  await loadRepoData();
  if(!names.length){st.className='status err';st.textContent='No se pudieron cargar las apuestas (data/apuestas.json)';return;}
  try{
    const r=await fetch(API,{cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const data=await r.json();
    const p=parse(data);
    TEAMS=p.teams; ORDER=p.order;
    PRESEASON=isPre(data);
    try{localStorage.setItem('nba-cache',JSON.stringify({t:Date.now(),data}));}catch(e){}
    st.className='status'; st.textContent='Actualizado '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+' · se refresca solo';
  }catch(err){
    let cached=null; try{cached=JSON.parse(localStorage.getItem('nba-cache'));}catch(e){}
    if(cached && !Object.keys(TEAMS).length){
      const p=parse(cached.data); TEAMS=p.teams; ORDER=p.order; PRESEASON=isPre(cached.data);
    }
    st.className='status err';
    st.textContent=cached?'Sin conexión con ESPN. Datos de '+new Date(cached.t).toLocaleString('es-ES'):'No se pudo cargar la clasificación';
  }
  render();
}
load(); setInterval(load,REFRESH_MS);
// ficha de un partido en directo: refrescar la estadística cada 30 s
setInterval(()=>{ if(tab==='cal'&&openGame&&BOX.id===openGame&&!(BOX.data&&BOX.data.header&&BOX.data.header.competitions[0].status.type.state==='post')) render(); },30000);
